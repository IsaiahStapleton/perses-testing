apiVersion: perses.dev/v1alpha1
kind: PersesDashboard
metadata:
  name: team-overview
  namespace: example-team
spec:
  display:
    name: Team Overview
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: Welcome
        plugin:
          kind: Markdown
          spec:
            text: |-
              This dashboard displays metrics scoped to the **example-team** namespace only.

              The datasource uses the namespace-aware Thanos endpoint (port 9092)
              which restricts all queries to the configured namespace(s).

              Use the namespace dropdown to filter if the datasource is
              configured with multiple namespaces.
    "0_1":
      kind: Panel
      spec:
        display:
          name: Running Targets
        plugin:
          kind: StatChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-defined-monitoring
                  query: count(up{namespace=~"$namespace"})
    "1_0":
      kind: Panel
      spec:
        display:
          name: CPU Usage
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-defined-monitoring
                  query: |
                    sum by (pod) (
                      rate(container_cpu_usage_seconds_total{namespace=~"$namespace"}[$__rate_interval])
                    )
                  seriesNameFormat: "{{pod}}"
    "1_1":
      kind: Panel
      spec:
        display:
          name: Memory Usage
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: bytes
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-defined-monitoring
                  query: |
                    sum by (pod) (
                      container_memory_working_set_bytes{namespace=~"$namespace"}
                    )
                  seriesNameFormat: "{{pod}}"
  layouts:
    - kind: Grid
      spec:
        display:
          title: Overview
          collapse:
            open: true
        items:
          - x: 0
            "y": 0
            width: 12
            height: 5
            content:
              $ref: "#/spec/panels/0_0"
          - x: 12
            "y": 0
            width: 12
            height: 5
            content:
              $ref: "#/spec/panels/0_1"
    - kind: Grid
      spec:
        display:
          title: Resource Usage
          collapse:
            open: true
        items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/1_0"
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/1_1"
  variables:
    - kind: ListVariable
      spec:
        allowAllValue: true
        allowMultiple: true
        display:
          hidden: false
          name: namespace
        name: namespace
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-defined-monitoring
            labelName: namespace
            matchers:
              - up
            duration: 1h
